<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    :root {
      --bg: #f5f4f1;
      --paper: #fff;
      --text: #333;
      --muted: #888;
      --accent: #d45b4c;
      --accent-dark: #b94336;
      --border: #e5e2dc;
      --soft: #f8f7f4;
      --max-width: 1080px;
      --content-width: 760px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =========================================================
       1. 顶部大横幅
       换文章时只需要修改 background-image、标题和简介
       ========================================================= */
    .cover {
      height: 620px;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.68)),
        url("https://lh3.googleusercontent.com/d/") center/cover;
      display: flex;
      align-items: flex-end;
      color: #fff;
    }

    .cover-inner {
      width: 100%;
      max-width: var(--max-width);
      margin: auto;
      padding: 70px 30px 65px;
      /* --- 新增/修改以下 3 行 --- */
      display: flex;
      align-items: center;
      gap: 25px; /* Logo 与右侧文字之间的间距 */
    }
    /* 新增 Logo 样式 */
    .cover-logo {
      width: 100px;
      height: 100px;
      object-fit: contain; /* 确保 Logo 图片按比例缩放不变形 */
      flex-shrink: 0;      /* 防止屏幕缩小或内容挤压时 Logo 被压缩 */
      border-radius: 50%;
    }

    /* 新增包裹右侧所有文字的容器样式 */
    .cover-text {
      flex: 1;
    }
    .cover-label {
      display: inline-block;
      padding: 5px 13px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 3px;
      background: rgba(0,0,0,.15);
      font-size: 12px;
      letter-spacing: 2px;
    }

    .cover h1 {
      max-width: 850px;
      margin: 0 0 16px;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 500;
      line-height: 1.2;
    }

    .cover-description {
      max-width: 650px;
      margin: 0;
      color: rgba(255,255,255,.88);
      font-size: 16px;
    }

    .page {
      max-width: var(--max-width);
      margin: auto;
      padding: 0 30px 100px;
    }

    /* =========================================================
       2. 行程单
       类似旅行网站的 Day 1 / Day 2 / Day 3 路线设计
       ========================================================= */
    .itinerary {
      position: relative;
      margin-top: -45px;
      padding: 35px 40px;
      background: var(--paper);
      border-radius: 4px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
      z-index: 2;
    }

    .itinerary-header {
      display: flex;
      align-items: baseline;
      gap: 15px;
      margin-bottom: 30px;
    }

    .itinerary-title {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 28px;
      font-weight: 500;
    }

    .itinerary-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .itinerary-list {
      position: relative;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .itinerary-list::before {
      content: "";
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 54px;
      width: 1px;
      background: var(--border);
    }

    .itinerary-day {
      position: relative;
      display: grid;
      grid-template-columns: 75px 1fr;
      gap: 25px;
      padding: 0 0 30px;
    }

    .itinerary-day:last-child {
      padding-bottom: 0;
    }

    .day-number {
      position: relative;
      z-index: 1;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
    }

    .day-number small {
      font-size: 10px;
      letter-spacing: 1px;
      opacity: .85;
    }

    .day-number strong {
      font-size: 20px;
      font-family: Georgia, serif;
    }

    .day-content {
      padding-top: 2px;
    }

    .day-title {
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 600;
    }

    .day-route {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: #555;
      font-size: 14px;
    }

    .route-place {
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--soft);
    }

    .route-arrow {
      color: var(--accent);
      font-size: 14px;
    }

    .day-note {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================================================
       3. 正文
       ========================================================= */
    .article {
      max-width: var(--content-width);
      margin: 75px auto 0;
    }

    /* 格式一：大标题 */
    .title {
      margin: 70px 0 25px;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.4;
    }

    /* 格式二：副标题 */
    .subtitle {
      margin: 38px 0 15px;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* 格式三：正文 */
    .text {
      margin: 0 0 18px;
      color: #3f3f3f;
      font-size: 16px;
      line-height: 2;
    }

    /* 格式四：特殊格式 */
    .quote {
      margin: 35px 0;
      padding: 22px 28px;
      background: var(--soft);
      border-left: 4px solid var(--accent);
      color: #555;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 18px;
      line-height: 1.9;
    }

    .quote strong {
      color: var(--accent-dark);
    }

    /* =========================================================
       4. 章节分隔符
       ========================================================= */
    .divider {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 60px 0;
      color: var(--accent);
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .divider span {
      font-size: 14px;
    }

    /* =========================================================
       5. 图片 Carousel
       ========================================================= */
    /* ===== Stand-alone Image ===== */
    .single-image {
      margin: 40px 0;
    }
    .single-image img {
      width: 100%;
      height: 360px;
      object-fit: contain;
      object-position: center;
      display: block;
      background: transparent;
      border-radius: 4px;
    }
    .single-image figcaption {
      margin-top: 9px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }
    /* =========================================================
   Two Pictures — 两张照片并排
   ========================================================= */
    .two_pictures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 40px 0;
    }
    .two_pictures figure {
      margin: 0;
    }
    .two_pictures-image {
      width: 100%;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
      border-radius: 4px;
    }
    .two_pictures-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .two_pictures figcaption {
      margin-top: 9px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }
    /* =========================================================
        Carousel — one picture at a time
       ========================================================= */
    .carousel {
      position: relative;
      margin: 40px 0;
      width: 100%;
    }

    .carousel-window {
      position: relative;
      width: 100%;
      height: 520px; /* Fixed carousel height — change this if needed */
      overflow: hidden;
      background: transparent;
      border-radius: 4px;
    }

    .carousel-slide {
      display: none;
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .carousel-slide.active {
      display: block;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Shows the ENTIRE image */
      object-position: center;
    }

    /* Previous / Next arrows */
    .carousel-button {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 42px;
      height: 42px;
      transform: translateY(-50%);
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .45);
      color: #fff;
      font-size: 25px;
      line-height: 42px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .carousel-button:hover {
      background: rgba(0, 0, 0, .7);
    }

    .carousel-button.prev {
      left: 15px;
    }

    .carousel-button.next {
      right: 15px;
    }

    /* Dots */
    .carousel-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
    }

    .carousel-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
      transition: all .2s;
    }

    .carousel-dot.active {
      width: 9px;
      height: 9px;
      background: var(--accent);
    }

    /* Caption */
    .carousel-caption {
      margin-top: 10px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }


    /* =========================================================
       6. 文章结尾
       ========================================================= */
    .article-end {
      margin-top: 100px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
    }

    .article-end-mark {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 20px;
    }

    footer {
      padding: 50px 20px;
      background: #292725;
      color: rgba(255,255,255,.55);
      text-align: center;
      font-size: 13px;
    }

    /* =========================================================
       7. 手机端
       ========================================================= */
    @media (max-width: 700px) {
      .cover { height: 520px;     }
      .cover-inner {        padding: 50px 20px;      }
      .page {        padding: 0 16px 80px;      }      
      .itinerary {        margin-top: -25px;        padding: 25px 20px;      }
      .itinerary-header {        display: block;      }
      .itinerary-subtitle {        display: block;        margin-top: 3px;      }
      .itinerary-list::before {        left: 39px;      }
      .itinerary-day {        grid-template-columns: 55px 1fr;        gap: 15px;      }
      .day-number {        width: 45px;        height: 45px;      }
      .day-number strong {        font-size: 17px;      }
      .article {        margin-top: 55px;      }
      .title {        margin-top: 55px;        font-size: 29px;      }
      .subtitle {
        font-size: 19px;
      }
      .text {
        font-size: 16px;
        line-height: 1.9;
      }
      .quote {
        padding: 18px 20px;
        font-size: 16px;
      }
      .carousel-window {
        height: 360px;
      }
      .carousel-button {
        width: 36px;
        height: 36px;
        font-size: 21px;
        line-height: 36px;
      }
      .carousel-button.prev {
        left: 10px;
      }
      .carousel-button.next {
        right: 10px;
      }
      .two_pictures {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .two_pictures-image {
        height: 300px;
      }
    }
    @media (max-width: 420px) {
      .cover h1 { font-size: 36px; }
      .cover-description { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       封面
       ========================================================= -->
  <header class="cover">
    <div class="cover-inner">
      <img src="https://lh3.googleusercontent.com/d/1rlJTg7OiuMoD-eoD9UJc4S4LudNFoVgY" alt="Logo" class="cover-logo">
      <div class="cover-text">
        <span class="cover-label">塔库电台</span>
        <h1></h1>
        <p class="cover-description"></p>
      </div>
    </div>
  </header>

  <main class="page">

    <!-- =======================================================
         行程单
         每一天一个 .itinerary-day
         可以自由增加 Day 4 / Day 5 / Day 6……
         ======================================================= -->
    

    <!-- =======================================================
         正文
         ======================================================= -->
    <article class="article">

      <!-- 格式 1：大标题 -->
      <h2 class="title">前言</h2>

      <div class="divider"><span>✦</span></div>

      



      <div class="article-end">
        <div class="article-end-mark">✦</div>
        MISSION ACCOMPLISHED
      </div>
    </article>
  </main>

  <footer>
    Travel Journal
  </footer>

<script>
  document.querySelectorAll('.carousel').forEach(carousel => {
    const slides = carousel.querySelectorAll('.carousel-slide');
    const dotsContainer = carousel.querySelector('.carousel-dots');
    const caption = carousel.querySelector('.carousel-caption');
    let current = 0;

    slides.forEach((slide, index) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot';
      dot.setAttribute('aria-label', `查看第 ${index + 1} 张图片`);
      dot.onclick = () => showSlide(carousel, index);
      dotsContainer.appendChild(dot);
    });

    showSlide(carousel, 0);
  });

  function showSlide(carousel, index) {
    const slides = carousel.querySelectorAll('.carousel-slide');
    const dots = carousel.querySelectorAll('.carousel-dot');
    const caption = carousel.querySelector('.carousel-caption');

    if (index < 0) index = slides.length - 1;
    if (index >= slides.length) index = 0;

    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));

    slides[index].classList.add('active');
    dots[index].classList.add('active');

    const image = slides[index].querySelector('img');
    caption.textContent = image.alt || '';

    carousel.dataset.current = index;
  }

  function changeSlide(button, direction) {
    const carousel = button.closest('.carousel');
    const current = Number(carousel.dataset.current || 0);
    showSlide(carousel, current + direction);
  }
</script>  
</body>
</html>
