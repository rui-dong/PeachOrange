  <style>
    :root {
      --bg-warm: #FAF5EF;
      --accent-soft: #E87A5D;
      --accent-dark: #D96B43;
      --text-main: #1E1B18;
      --text-muted: #8C827A;
      --card-width: 250px;
      --card-gap: 1.8rem;
    }

    body {
      background-color: var(--bg-warm);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }

    .font-serif-sc {
      font-family: 'Noto Serif SC', 'Cinzel', serif;
    }

    .font-brand {
      font-family: 'Cinzel', serif;
    }

    /* 滚动条统一风格 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF5EF;
    }
    ::-webkit-scrollbar-thumb {
      background: #D96B43;
      border-radius: 3px;
    }

    /* SESSION 核心布局 */
    .region-session {
      position: relative;
      width: 100%;
      height: 75vh;
      min-height: 540px;
      margin-bottom: 8rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .session-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: background-image 0.8s ease-in-out;
      z-index: 1;
    }

    .session-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;   
      height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(5, 13, 20, 0.95) 0%, 
        rgba(8, 22, 34, 0.80) 40%, 
        rgba(13, 33, 49, 0.35) 100%
      );
      z-index: 2;
    }

    /* 顶部节点指示器 */
    .session-progress-bar {
      position: relative;
      z-index: 10;
      width: 65%;
      margin: 0 auto 3.5rem;
      display: flex;
      align-items: center;
    }

    .node-track {
      position: relative;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .node-track::before {
      content: '';
      position: absolute;
      left: -35px;
      width: 35px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2));
    }

    .node-track::after {
      content: '';
      position: absolute;
      right: -35px;
      width: 35px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), transparent);
    }

    .node-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .node-dot.active {
      width: 18px;
      height: 18px;
      background: #FFFFFF;
      box-shadow: 0 0 15px rgba(217, 107, 67, 0.8), 0 0 20px #D96B43;
      border: 3px solid #D96B43;
    }

    .session-container {
      position: relative;
      z-index: 3;
      width: 100%;
      display: grid;
      grid-template-columns: 42% 58%;
      align-items: center;
    }

    /* 左侧文本内容 */
    .left-content {
      padding-left: 14%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 560px;
    }

    .region-badge {
      position: relative;
      z-index: 10;
      display: inline-block;
      align-self: flex-start;
      top: 0rem;
      left: 2%;
      padding: 6px 16px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #E87A5D;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .article-title {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 1.2rem;
      transition: opacity 0.3s ease;
      color: #FAF5EF;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 7.5rem;               
      min-height: 7.5rem;          
    }

    .article-subtitle {
      font-size: 1rem;
      color: #8C827A;
      line-height: 1.6;
      margin-bottom: 2.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: opacity 0.3s ease;
      min-height: 4.8rem; 
    }

    .action-controls-wrapper {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      margin-top: auto;
    }

    .explore-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.85rem 2.2rem;
      background: #D96B43;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(217, 107, 67, 0.35);
      transition: all 0.3s ease;
    }

    .explore-btn:hover {
      background: #C85A32;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(200, 90, 50, 0.45);
    }

    .explore-btn:not([href]):hover {
      background: #D96B43;
      color: #FFFFFF;
      transform: none;
      box-shadow: 0 10px 25px rgba(217, 107, 67, 0.35);
    }

    .explore-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    
    .slider-controls {
      position: static;
      display: flex;
      gap: 0.8rem;
      z-index: 10;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(13, 33, 49, 0.6);
      backdrop-filter: blur(8px);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    .control-btn:hover {
      background: #D96B43;
      border-color: #D96B43;
      color: #FFFFFF;
      transform: scale(1.08);
    }

    /* 右侧卡片滑块外罩 */
    .right-slider-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 3.5rem 0 3.5rem 1rem;
      margin-top: -1.5rem;
      margin-bottom: -1.5rem;
    }

    .cards-track {
      display: flex;
      gap: var(--card-gap);
      align-items: center;
      will-change: transform;
    }

    .cards-track.is-animating {
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 卡片基础与放缩动画 */
    .option-card {
      position: relative;
      width: var(--card-width);
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
      
      transform-origin: left center;
      transform: scale(0.88);
      opacity: 0.65;
      filter: brightness(0.75);
      
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                  opacity 0.45s ease,
                  filter 0.45s ease,
                  border-color 0.45s ease,
                  box-shadow 0.45s ease;
    }

    .option-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .card-label {
      position: absolute;
      top: 1.2rem;
      left: 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #FAF5EF;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 2;
    }

    .option-card.active {
      opacity: 1;
      filter: brightness(1);
      transform: scale(1.08);
      border-color: #D96B43;
      margin-right: 2.4rem;
      box-shadow: 0 0 25px rgba(217, 107, 67, 0.4), 0 20px 45px rgba(0, 0, 0, 0.7);
      z-index: 5;
    }

    .option-card.active img {
      transform: scale(1.05);
    }

    @media (max-width: 1024px) {
      .session-container { grid-template-columns: 1fr; }
      .left-content { padding-left: 6%; max-width: 100%; }
      .region-session { height: auto; padding: 4rem 0; }
      .session-progress-bar { width: 85%; }
    }
  </style>
</head>

    // 2. 分类规则定义
    const TIME_GROUPS = [
      { key: "before_2012", badge: "2014年之前", title: "早年探索 · - 2014", filter: card => card.year < 2013.12 },
      { key: "2012_2020", badge: "2012 - 2020", title: "甜蜜的磨合 · 2014 - 2016", filter: card => card.year >= 2013.12 && card.year <= 2016.05 },
      { key: "2020_2026", badge: "2020 - 2026", title: "忙里偷闲 · 2016 - 2020", filter: card => card.year > 2016.05 && card.year <= 2020 },
      { key: "2020_2026", badge: "2020 - 2026", title: "扩大的队伍 · 2020-2024", filter: card => card.year > 2020 && card.year <= 2024.10 },
      { key: "2020_2026", badge: "2020 - 2026", title: "新生之后 · 2024 - ", filter: card => card.year > 2024.10  }
    ];

    const GEO_GROUPS = [
      { key: "EUROPE", badge: "EUROPE · 欧洲地区", title: "欧洲专区", filter: card => card.region === "EUROPE" },
      { key: "ASIA", badge: "ASIA · 亚洲地区", title: "亚洲专区", filter: card => card.region === "ASIA" },
      { key: "USA", badge: "USA · 美国", title: "美国专区", filter: card => card.region === "USA" },
      { key: "MENA", badge: "Middle East & North Africa · 中东和北非", title: "中东北非", filter: card => card.region === "MENA" }  
    ];

    const TYPE_GROUPS = [
      { key: "GrandTour", badge: "Grand Tours · 深度自驾游", title: "深度自驾", filter: card => card.type === "GrandTour" },
      { key: "CityHopping", badge: "City Hopping · 城市串联", title: "城市串联", filter: card => card.type === "CityHopping" },
      { key: "HubSpoke", badge: "Hub-Spoke · 城市辐射游 ", title: "城市辐射", filter: card => card.type === "HubSpoke" },
      { key: "CityBreak", badge: "City Break · 微度假", title: "微度假", filter: card => card.type === "CityBreak" },
      { key: "Flyover", badge: "Fly-over · 过境游", title: "过境游", filter: card => card.type === "Flyover" }   
    ];

    // 3. 构建 Session DOM 结构
    function buildSessionHTML(group, cards) {
      const cardsHTML = cards.map(c => `
        <div class="option-card" data-id="${c.id}" data-title="${c.title}" data-year="${c.year}" data-sub="${c.sub}" data-bg="${c.bg}" data-url="${c.url}">
          <span class="card-label font-serif-sc">${c.label}</span>
          <img src="${c.img}" alt="${c.label}">
        </div>
      `).join('');

      return `
        <span class="region-badge font-brand">${group.badge}</span>
        <section class="region-session">
          
          <div class="session-bg"></div>
          <div class="session-overlay"></div>

          <div class="session-progress-bar">
            <div class="node-track"></div>
          </div>
          
          <div class="session-container">
            <div class="left-content">
              
              <h2 class="article-title font-serif-sc">加载中...</h2>
              <p class="article-subtitle font-sans">加载中...</p>
              <div class="action-controls-wrapper">
                <a href="#" class="explore-btn font-sans">
                  Explore 探索文章
                  <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>

                <div class="slider-controls">
                  <button class="control-btn prev-btn">&#10094;</button>
                  <button class="control-btn next-btn">&#10095;</button>
                </div>
              </div>
            </div>

            <div class="right-slider-wrapper">
              <div class="cards-track">
                ${cardsHTML}
              </div>
            </div>

          </div>
        </section>
      `;
    }

    // 4. 渲染页面模式
    function renderMode(mode) {
      const appContainer = document.getElementById('app-sessions-container');
      const GROUP_MAP = {
        time: TIME_GROUPS,
        geo: GEO_GROUPS,
        type: TYPE_GROUPS,
      };

      const groups = GROUP_MAP[mode] ?? GEO_GROUPS;
      
      appContainer.innerHTML = '';

      groups.forEach(group => {
        const matchedCards = ALL_CARDS.filter(group.filter);
        if (matchedCards.length > 0) {
          appContainer.insertAdjacentHTML('beforeend', buildSessionHTML(group, matchedCards));
        }
      });

      // 初始化滑动交互逻辑
      initSliders();
    }

    // 5. 还原全套交互逻辑与动画视差
    function initSliders() {
      document.querySelectorAll('.region-session').forEach(session => {
        const bgElement = session.querySelector('.session-bg');
        const track = session.querySelector('.cards-track');
        const nodeTrack = session.querySelector('.node-track');
        const titleElem = session.querySelector('.article-title');
        const subElem = session.querySelector('.article-subtitle');
        const exploreBtn = session.querySelector('.explore-btn');
        const prevBtn = session.querySelector('.prev-btn');
        const nextBtn = session.querySelector('.next-btn');

        const cards = Array.from(track.querySelectorAll('.option-card'));
        const count = cards.length;
        
        let currentIndex = 0;

        // 生成节点小圆点 node-dot
        const dots = [];
        nodeTrack.innerHTML = ''; 
        cards.forEach((_, idx) => {
          const dot = document.createElement('div');
          dot.classList.add('node-dot');
          if (idx === 0) dot.classList.add('active');
          nodeTrack.appendChild(dot);
          dots.push(dot);
        });

        // 更新激活状态
        const updateState = () => {
          cards.forEach((card, index) => {
            card.classList.toggle('active', index === currentIndex);
          });

          dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
          });

          const activeCard = cards[currentIndex];

          bgElement.style.backgroundImage = `url('${activeCard.dataset.bg}')`;

          titleElem.style.opacity = '0';
          subElem.style.opacity = '0';

          setTimeout(() => {
            const safeYear = parseFloat(activeCard.dataset.year).toFixed(2); 
            titleElem.innerHTML = `${activeCard.dataset.title} <span style="font-size: 0.55em; font-weight: normal; margin-left: 8px; color: #E87A5D;">${safeYear}</span>`;
            subElem.textContent = activeCard.dataset.sub;

            const targetUrl = activeCard.dataset.url;
            const isValidUrl = targetUrl && targetUrl.trim() !== '' && targetUrl.trim() !== '#';

            if (isValidUrl) {
              exploreBtn.href = targetUrl;
              exploreBtn.style.opacity = '1';
              exploreBtn.style.cursor = 'pointer';
              exploreBtn.onclick = null;
            } else {
              exploreBtn.removeAttribute('href');
              exploreBtn.style.opacity = '0.4';
              exploreBtn.style.cursor = 'not-allowed';
              
              exploreBtn.onclick = (e) => {
                e.preventDefault();
                return false;
              };
            }

            titleElem.style.opacity = '1';
            subElem.style.opacity = '1';
          }, 120);

          prevBtn.style.opacity = currentIndex === 0 ? '0.3' : '1';
          nextBtn.style.opacity = currentIndex === count - 1 ? '0.3' : '1';
        };

        updateState();

        const getStepWidth = () => {
          const style = window.getComputedStyle(track);
          const gap = parseFloat(style.gap) || 28.8;
          return 250 + gap;
        };

        const slideTo = (index) => {
          if (index < 0 || index >= count) return;

          currentIndex = index;
          const step = getStepWidth();

          track.classList.add('is-animating');
          track.style.transform = `translateX(-${currentIndex * step}px)`;

          updateState();
        };

        nextBtn.addEventListener('click', () => {
          if (currentIndex < count - 1) {
            slideTo(currentIndex + 1);
          }
        });

        prevBtn.addEventListener('click', () => {
          if (currentIndex > 0) {
            slideTo(currentIndex - 1);
          }
        });

        cards.forEach((card, index) => {
          card.addEventListener('click', () => {
            if (index !== currentIndex) {
              slideTo(index);
            } else {
              const targetUrl = card.dataset.url;
              if (targetUrl && targetUrl.trim() !== '' && targetUrl.trim() !== '#') {
                window.location.href = targetUrl;
              }
            }
          });
        });
      });
    }

    // 6. 绑定 Header 模式切换按钮样式切换
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.remove('active', 'bg-terracotta', 'text-white', 'shadow-sm');
          b.classList.add('text-charcoal-600');
        });
        
        e.target.classList.add('active', 'bg-terracotta', 'text-white', 'shadow-sm');
        e.target.classList.remove('text-charcoal-600');
        
        const mode = e.target.dataset.mode;
        renderMode(mode);
      });
    });

    // 默认打开页面加载地理分类 (geo)
    renderMode('geo');
  </script>
</body>
</html>
